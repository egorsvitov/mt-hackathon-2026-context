[project]
name = "route-matching"
version = "0.2.0"
description = "Causal stop-to-stop route discovery and streaming map matching"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ml = ["catboost>=1.2.8,<1.3", "pandas>=2.2,<3", "pyarrow>=19,<24"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
route-match = "route_matching.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
