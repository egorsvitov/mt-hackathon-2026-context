# NDTP-парсер + backend (признаки, прогнозы, API) + дашборд диспетчера.
# Перед первым запуском:
#   python dashboard/tools/build_fixtures.py --data-dir <dataset>   # сеть маршрутов и replay
#   python dashboard/tools/fetch_basemap.py                         # подложка карты (~60 МБ)
# Запуск: DATA_DIR=<путь к датасету> docker compose up --build   ->  http://localhost:8080
services:
  ml-service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    ports: ["${ML_PORT:-8001}:8001"]
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-01_baseline}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  ndtp-parser:
    build: ./ndtp-parser
    ports: ["${NDTP_PORT:-9201}:9201"]
    environment:
      BACKEND_URL: http://backend:8000/api/v1/stream/telemetry
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports: ["${BACKEND_PORT:-8000}:8000"]
    environment:
      DATA_DIR: /data
      NETWORK_PATH: /refdata/network.json
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001/predict}
      REPLAY_AUTOSTART: ${REPLAY_AUTOSTART:-true}
      REPLAY_SPEED: ${REPLAY_SPEED:-1}
      REPLAY_START: ${REPLAY_START:-08:30}
    volumes:
      - ${DATA_DIR:-../dataset}:/data:ro
      - ./dashboard/data:/refdata:ro
    depends_on:
      ml-service:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports: ["${DASHBOARD_PORT:-8080}:80"]
    environment:
      DASHBOARD_API: /api/v1
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
