# Backend (приём телеметрии, признаки, прогнозы, API) + дашборд диспетчера.
# Перед первым запуском:
#   См. map_matching/README.md: каталог, сеть маршрутов и matched replay
#   python dashboard/tools/fetch_basemap.py                         # подложка карты (~60 МБ)
# Запуск: DATA_DIR=<путь к датасету> docker compose up --build   ->  http://localhost:8080
services:
  backend:
    build: ./backend
    ports: ["${BACKEND_PORT:-8000}:8000"]
    environment:
      DATA_DIR: /data
      NETWORK_PATH: /refdata/network.json
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001/predict}
      REPLAY_AUTOSTART: "true"
      REPLAY_SPEED: ${REPLAY_SPEED:-1}
      REPLAY_START: ${REPLAY_START:-08:30}
    volumes:
      - ${DATA_DIR:-../dataset}:/data:ro
      - ./dashboard/data:/refdata:ro

  dashboard:
    build: ./dashboard
    ports: ["${DASHBOARD_PORT:-8080}:80"]
    environment:
      DASHBOARD_API: /api/v1
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
