[project]
name = "route-delay-v3"
version = "0.1.0"
description = "Causal rolling route-aware bus delay experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "catboost>=1.2.8,<1.3",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "route-matching",
  "transport-delay",
  "route-delay-v2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
delay-v3 = "route_delay_v3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
route-matching = { path = "../../map_matching", editable = true }
transport-delay = { path = "../01_catboost_baseline", editable = true }
route-delay-v2 = { path = "../02_route_components", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
