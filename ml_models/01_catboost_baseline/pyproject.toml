[project]
name = "transport-delay"
version = "0.1.0"
description = "Causal CPU CatBoost bus delay predictor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "catboost>=1.2.8,<1.3",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "pyarrow>=19,<24",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
delay = "transport_delay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

